# Static analysis configuration for ZoneCraft.
#
# The baseline is `flutter_lints`; on top of it this file enables the analyzer's
# strict language modes and a curated set of *correctness* rules. Pure-style
# rules are deliberately left off — `public_member_api_docs`,
# `lines_longer_than_80_chars`, `always_use_package_imports` and
# `prefer_int_literals` alone account for ~1400 findings here and bury the
# signal. See planning/ for the measurements behind that choice.
#
# `riverpod_lint` is NOT used: it needs `custom_lint`, which caps at
# `analyzer ^8.0.0`, while `drift_dev >= 2.32.1` requires `analyzer >= 10`.
# Pub cannot resolve the two together. Revisit when custom_lint catches up.
#
# `flutter analyze` (run by scripts/build.sh) is fatal on infos, so every rule
# below is enforced at build time.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Type the boundaries: these three catch untyped JSON and implicit dynamic,
    # which is exactly where the import/export fixed point and the Overpass
    # parsers live.
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    # Generated; a lint fix here would not survive the next build_runner run.
    - "**/*.g.dart"
    - "test/generated_migrations/**"

linter:
  rules:
    # --- async correctness -------------------------------------------------
    # A dropped Future in a button handler is a button that silently does
    # nothing; `unawaited(...)` makes dropping it a decision, not an accident.
    - discarded_futures
    - unawaited_futures
    - unnecessary_await_in_return
    - avoid_slow_async_io
    # The app owns exactly one StreamSubscription<Position> (track_recorder).
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously

    # --- exhaustiveness ----------------------------------------------------
    # A `default:` arm silently swallowing an unknown enum value has already
    # cost this project once (combineLayers). Enumerate instead.
    - no_default_cases
    - exhaustive_cases
    - invalid_case_patterns

    # --- null / type safety ------------------------------------------------
    - cast_nullable_to_non_nullable
    - unnecessary_null_checks
    - null_check_on_nullable_type_parameter
    - avoid_dynamic_calls
    - avoid_type_to_string
    - collection_methods_unrelated_type
    - test_types_in_equals
    - avoid_equals_and_hash_code_on_mutable_classes

    # --- error handling ----------------------------------------------------
    # A bare `catch` at an I/O edge is often deliberate here (graceful offline
    # degradation). Where it is, keep it with an `// ignore:` and a reason —
    # `document_ignores` makes the reason mandatory.
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - throw_in_finally
    - document_ignores

    # --- API shape ---------------------------------------------------------
    - always_declare_return_types
    - avoid_positional_boolean_parameters
    - avoid_returning_null_for_void
    - use_string_in_part_of_directives
    - implicit_reopen
    - deprecated_member_use_from_same_package

    # --- dead / suspicious code -------------------------------------------
    - literal_only_boolean_expressions
    - no_self_assignments
    - no_wildcard_variable_uses
    - unnecessary_statements
    - prefer_final_locals
    - prefer_final_in_for_each
