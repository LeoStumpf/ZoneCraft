# The verification ZoneCraft did not have.
#
# Until now the only gate was `scripts/build.sh` on one laptop, with a
# `--skip-checks` escape hatch — and a dependency bump is exactly the moment
# somebody reaches for it. Nothing else ever told this project that a change
# was safe.
#
# Four steps, in increasing cost:
#   1. the lockfile is honoured    — `--enforce-lockfile` turns the committed
#                                    pubspec.lock into an assertion rather than
#                                    a suggestion, so a bump must be deliberate
#   2. formatting                  — cheapest, and keeps diffs reviewable
#   3. analyze + test              — the same gate build.sh runs
#   4. a *release* build           — R8 and the native-asset path only exist in
#                                    release, so a break there would otherwise
#                                    surface the night before a store upload
#
# With six repository secrets the release build is the shippable one -- the
# same build `scripts/build.sh --bundle` makes on the laptop, signed with the
# upload key and pointed at the keyed tile provider -- and it is kept as a
# workflow artifact (`zonecraft-release-<sha>`, 30 days). The secrets mirror
# two files that live outside version control, so rotating either means
# rotating both:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS       <- android/key.properties
#                                                    + the upload keystore
#   TILE_URL, TILE_ATTRIBUTION                    <- ~/.config/zonecraft/release.env
#
# Without them -- a fork's pull request never sees secrets -- every step marked
# `if: env.HAVE_KEYSTORE` is skipped: `android/app/build.gradle.kts` falls back
# to the debug key when `key.properties` is absent and `scripts/build.sh` builds
# against the community OSM tiles when TILE_URL is unset. That build is the
# smoke test this workflow started as, and it is deliberately not uploaded: a
# release-looking APK nobody can ship would only mislead.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # The `secrets` context cannot be read in a step's `if:`; an env var can.
    # Empty on a fork's pull request, set on every push to main.
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # The Android build needs a JDK, and this is the *runtime* one, not the
      # bytecode target — `android/app/build.gradle.kts` pins source, target
      # and jvmTarget to 17 either way. It is 21 because that is what builds
      # this project on the developer's machine, and CI that runs a different
      # JDK from the one a human uses reports on a build nobody makes. AGP is
      # 9.0.1 on Gradle 9.1.0 here, which is far enough ahead that guessing at
      # the minimum it tolerates is not worth a red run for a reason nobody
      # changed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned, not `stable`. A moving SDK would mean a green run today and a
      # red one tomorrow for reasons nobody changed — and `app_links` already
      # sets the floor at 3.44.0 in pubspec.lock.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Dependencies match the lockfile
        run: flutter pub get --enforce-lockfile

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Materialise what build.gradle.kts reads. The keystore lands next to the
      # app module because Gradle's `file()` there resolves relative to
      # android/app/. Both paths are gitignored (`*.jks`, `**/key.properties`).
      - name: Release signing
        if: env.HAVE_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > android/key.properties

      # Last because it is the slowest. Release mode only: debug would not
      # exercise R8 or the native-asset path, which is the whole reason this
      # step exists. Through build.sh, not a bare `flutter build`, so the
      # dart-defines cannot drift from the laptop build: it forwards TILE_URL /
      # TILE_ATTRIBUTION, prints the tile source with the key masked, and
      # refuses TILE_ALLOWS_PREFETCH without a URL. Checks are skipped because
      # format, analyze and test are the steps above.
      - name: Release build (APK)
        env:
          TILE_URL: ${{ secrets.TILE_URL }}
          TILE_ATTRIBUTION: ${{ secrets.TILE_ATTRIBUTION }}
        run: scripts/build.sh --release --skip-checks

      - name: Release build (App Bundle)
        if: env.HAVE_KEYSTORE != ''
        env:
          TILE_URL: ${{ secrets.TILE_URL }}
          TILE_ATTRIBUTION: ${{ secrets.TILE_ATTRIBUTION }}
        run: scripts/build.sh --bundle --skip-checks

      # Gradle's fallback to the debug key is silent, and an artifact that looks
      # like a release but cannot be uploaded to Play is exactly the failure
      # worth a red run. keytool comes with the setup-java JDK.
      - name: Signed with the upload key, not debug
        if: env.HAVE_KEYSTORE != ''
        run: |
          for f in build/app/outputs/flutter-apk/app-release.apk \
                   build/app/outputs/bundle/release/app-release.aab; do
            certs="$(keytool -printcert -jarfile "$f")"
            echo "== $f"
            echo "$certs" | grep -E 'Owner:|SHA256:'
            if echo "$certs" | grep -q 'CN=Android Debug'; then
              echo "!!! $f is signed with the debug key" >&2
              exit 1
            fi
          done

      - name: Keep the signed build
        if: env.HAVE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: zonecraft-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
